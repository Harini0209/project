<html>
    <body>
        <button id="mybutton">Click Me</button>
        <script>
            function showmessage() {
                alert("Hello, World!");
            }
            function showmessages(){
                alert ("WARNING!!");
            }
             const button = document.getElementById("mybutton");
             button.onclick = showmessage;
             button.onclick = showmessages;
        </script>
    </body>
</html>
